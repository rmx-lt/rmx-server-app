<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set the theme before first paint (no flash). Same rules as src/utils/theme.ts.
      (function () {
        var c = "system";
        try { c = localStorage.getItem("rmx:theme") || "system"; } catch (e) {}
        var dark = c === "dark" || (c !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="stylesheet" href="../src/styles/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../src/assets/rmx-favicon.png" />

    <title>RMX</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="../src/app/main.tsx"></script>
  </body>
</html>
