# Checks only: Go, client, integration tests and a Docker image build (never
# pushed). Runs on PRs to development and on pushes to development, with no
# path filters, so every development commit has results. Why: the four job
# names are the required checks (ruleset `rmx: CI`); production only changes
# through a PR from development, which reuses these results, so production
# needs no CI run of its own. The image is pushed and deployed by deploy.yml.
# Spec: https://github.com/rmx-lt/rmx-server-app/issues/169
name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes the older run, on a PR and on development alike.
  cancel-in-progress: true

jobs:
  go:
    name: Go (fmt, vet, staticcheck, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Installs the Go version from go.mod and caches modules and the build.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go tool staticcheck ./...
      # Includes internal/arch (the import rules) and the public-route allow-list.
      - run: go test -race ./...
      - name: Generated TypeScript types are up to date
        run: |
          go run ./cmd/gen-ts
          # Any difference means the committed copy is stale.
          # Fix: go run ./cmd/gen-ts, then commit web/src/data/api/generated.
          git add -N web/src/data/api/generated
          git diff --exit-code -- web/src/data/api/generated

  # The job and its name stay "client": the name is a required check in the
  # org rulesets. The code lives in web/.
  client:
    name: Client (eslint, tsc, bun test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  integration:
    name: Integration tests (TimescaleDB + Mosquitto)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The same compose file as local development. (GitHub "service
      # containers" start before checkout, so they can't mount Mosquitto's
      # config files; compose can, and keeps CI identical to local.)
      - name: Start TimescaleDB and Mosquitto
        run: |
          cp .env.example .env
          docker compose -f compose.dev.yaml up -d --wait
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The settings come from the .env copied above (the tests load it).
      - run: go test -tags integration -count=1 ./...
      - name: Service logs
        if: failure()
        run: docker compose -f compose.dev.yaml logs

  # Builds the image to test the Dockerfile; never pushed (deploy.yml pushes).
  # No needs: it runs in parallel with the tests to shorten the PR wait.
  image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
