name: CI

on:
  pull_request:
  push:
    branches: [development, production]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on branches and tags always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go (fmt, vet, staticcheck, unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Installs the Go version from go.mod and caches modules and the build.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test -race ./...
      - name: Generated TypeScript types are up to date
        run: |
          go run ./cmd/gen-ts
          # Any difference means the committed copy is stale.
          # Fix: go run ./cmd/gen-ts, then commit client/src/generated.
          git add -N client/src/generated
          git diff --exit-code -- client/src/generated

  client:
    name: Client (eslint, tsc, bun test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('client/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  integration:
    name: Integration tests (TimescaleDB + Mosquitto)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The same compose file as local development. (GitHub "service
      # containers" start before checkout, so they can't mount Mosquitto's
      # config files; compose can, and keeps CI identical to local.)
      - name: Start TimescaleDB and Mosquitto
        run: |
          cp .env.example .env
          docker compose -f compose.dev.yaml up -d --wait
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The settings come from the .env copied above (the tests load it).
      - run: go test -tags integration -count=1 ./...
      - name: Service logs
        if: failure()
        run: docker compose -f compose.dev.yaml logs

  image:
    name: Docker image
    needs: [go, client, integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/rmx-lt/rmx-backend-probe
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/production' }}
            type=raw,value=production,enable=${{ github.ref == 'refs/heads/production' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      # Pushed only from production and v* tags; pull requests and development
      # only build it (to test the Dockerfile).
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy every push to production (a merged development -> production PR).
  # The SSH key's authorized_keys entry on the VPS
  # forces one script (/usr/local/sbin/rmx-deploy-probe, source in rmx-server-infra:
  # services/probe/deploy/), so the only thing this job can send is the tag.
  # The script pulls the image, restarts probe-app, waits for /probe/health
  # and rolls back if it isn't healthy (then this job fails).
  # Secrets: DEPLOY_HOST, DEPLOY_SSH_KEY (private key), DEPLOY_KNOWN_HOSTS
  # (the VPS host key line, pinned, so no trust-on-first-use).
  deploy:
    name: Deploy to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: [image]
    runs-on: ubuntu-24.04
    environment: production
    # One deploy at a time, in order; never cancel one halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy sha-<short> over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # Same tag as the image job's type=sha,format=short (7 characters).
          TAG="sha-${GITHUB_SHA::7}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # Retry only connection failures (exit 255): the VPS network
          # sometimes drops new SSH connections. The script is idempotent.
          for attempt in 1 2 3; do
            rc=0
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              "deploy@$DEPLOY_HOST" "$TAG" || rc=$?
            [ "$rc" -ne 255 ] && break
            echo "SSH connection failed (attempt $attempt), retrying in 20 s"
            sleep 20
          done
          rm -f ~/.ssh/deploy_key
          exit "$rc"
