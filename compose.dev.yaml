# Local development and CI stack: TimescaleDB + Mosquitto.
#   docker compose -f compose.dev.yaml up -d --wait
# Ports bind to 127.0.0.1 only, on unusual numbers so they don't clash with a
# Postgres or Mosquitto already installed on the PC.
name: rmx-server-dev

services:
  db:
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-db-dev}
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2.1-alpine
    # Build the password file from .env, then start the broker.
    # ($$ is a literal $ for the container's shell.)
    # The image's anonymous /mosquitto/data volume survives restarts and
    # recreates, and `mosquitto_passwd -c` refuses an existing file, so
    # delete the old one first.
    command:
      - sh
      - -c
      - |
        set -e
        rm -f /mosquitto/data/passwd
        mosquitto_passwd -c -b /mosquitto/data/passwd app "$$APP_PASSWORD"
        mosquitto_passwd -b /mosquitto/data/passwd test-device "$$TEST_DEVICE_PASSWORD"
        chown mosquitto:mosquitto /mosquitto/data/passwd
        chmod 0600 /mosquitto/data/passwd
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    environment:
      APP_PASSWORD: ${MQTT_PASSWORD:-app-dev}
      TEST_DEVICE_PASSWORD: ${TEST_DEVICE_PASSWORD:-test-device-dev}
    ports:
      - "127.0.0.1:11883:1883"
    volumes:
      - ./dev/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./dev/mosquitto/acl:/mosquitto/config/acl:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
